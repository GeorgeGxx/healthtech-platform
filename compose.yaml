  # ============================================================================
  # 16. Microservicio Autónomo: Pharmacy-Service (NestJS 12 + PostgreSQL 18 + Kafka)
  # ============================================================================
  pharmacy-service:
    build:
      context: ./pharmacy-service
      dockerfile: Dockerfile
    image: georgegxx/pharmacy-service:latest
    container_name: pharmacy-service
    environment:
      PORT: 3004
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: centromedico
