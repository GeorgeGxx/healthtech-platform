services:
  # ============================================================================
  # 1. Base de Datos Relacional: PostgreSQL 18
  # ============================================================================
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: centromedico
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d centromedico"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. Caché Distribuido y Sesiones: Redis 8.8.1-alpine
  # ============================================================================
  redis:
    image: redis:8.8.1-alpine
    container_name: redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # 3. Observabilidad: Elasticsearch 9.5.5 (Single-Node)
  # ============================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    container_name: elasticsearch
    environment:
      - node.name=elasticsearch-node1
      - cluster.name=cluster
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================================================================
  # 4. Observabilidad: Kibana 9.5.5
  # ============================================================================
  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.5
    container_name: kibana
    environment:
      - SERVER_NAME=kibana.local
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_SSL_VERIFICATIONMODE=none
      - TELEMETRY_ENABLED=false
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================================
  # 5. Observabilidad: Elastic Agent 9.5.5 (APM & OTLP Collector)
  # ============================================================================
  elastic-agent:
    image: docker.elastic.co/elastic-agent/elastic-agent:9.5.5
    container_name: elastic-agent
    user: root
    environment:
      - FLEET_STANDALONE=true
    volumes:
      - ./observability/elastic-agent.yml:/etc/elastic-agent/elastic-agent.yml:ro
    ports:
      - "8200:8200" # APM Server & OTLP HTTP
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================================
  # 6. IAM y Autenticación RBAC: Keycloak 26.8.1 conectado a PostgreSQL 18
  # ============================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_HTTP_PORT=8080
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================================
  # 7. API Gateway: Kong Gateway 3.9.4 (DB-less mode)
  # ============================================================================
  kong:
    image: kong:3.9.4
    container_name: kong
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/etc/kong/kong.yml
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
      - KONG_PROXY_LISTEN=0.0.0.0:8000, 0.0.0.0:8443 ssl
    ports:
      - "8000:8000" # Proxy HTTP principal
      - "8443:8443" # Proxy HTTPS
      - "8001:8001" # Admin API
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml:ro
    depends_on:
      - keycloak
      - notification-service
      - appointment-service
      - patient-service
      - billing-service
      - pharmacy-service
      - staff-service
      - clinical-records-service
    restart: unless-stopped

  # ============================================================================
  # 9. Servidor Web & Reverse Proxy: Nginx + Angular 21 (Multi-stage)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: georgegxx/frontend:latest
    container_name: frontend
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - kong
    restart: unless-stopped

  # ============================================================================
  # 10. Event Backbone: Apache Kafka 8.x / Confluent (Modo KRaft Autónomo)
  # ============================================================================
  kafka:
    image: confluentinc/cp-kafka:8.3.2
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    ports:
      - "29092:29092"
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9092' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ============================================================================
  # 11. Monitoreo y Administración de Eventos: Kafka UI
  # ============================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: centromedico-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8085:8080"
    depends_on:
      - kafka
    restart: unless-stopped

  # ============================================================================
  # 12. Worker de Eventos Asíncronos: Notification-Service (NestJS 12 + Kafka)
  # ============================================================================
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    image: georgegxx/notification-service:latest
    container_name: notification-service
    environment:
      PORT: 3005
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: centromedico
      KAFKA_BROKER: kafka:9092
      KAFKAJS_NO_PARTITIONER_WARNING: 1
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-true}
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/healthtech-realm/protocol/openid-connect/certs
      OTEL_EXPORTER_OTLP_ENDPOINT: http://elastic-agent:4318
      OTEL_SERVICE_NAME: notification-service
    ports:
      - "127.0.0.1:3005:3005"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3005/api/notifications/health/liveness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================================
  # 13. Microservicio Autónomo: Appointment-Service (NestJS 12 + Sagas + Kafka)
  # ============================================================================
  appointment-service:
    build:
      context: ./appointment-service
      dockerfile: Dockerfile
    image: georgegxx/appointment-service:latest
    container_name: appointment-service
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: centromedico
      KAFKA_BROKER: kafka:9092
      KAFKAJS_NO_PARTITIONER_WARNING: 1
      PATIENT_SERVICE_URL: http://patient-service:3002
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-true}
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/healthtech-realm/protocol/openid-connect/certs
      OTEL_EXPORTER_OTLP_ENDPOINT: http://elastic-agent:4318
      OTEL_SERVICE_NAME: appointment-service
    ports:
