  # ============================================================================
  # 18. Microservicio Autónomo: Clinical-Records-Service (NestJS 12 + ECE + HIPAA)
  # ============================================================================
  clinical-records-service:
    build:
      context: ./clinical-records-service
      dockerfile: Dockerfile
    image: georgegxx/clinical-records-service:latest
    container_name: clinical-records-service
    environment:
      PORT: 3006
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: centromedico
      ELASTICSEARCH_URL: http://elasticsearch:9200
      PHI_ENCRYPTION_KEY: ${PHI_ENCRYPTION_KEY:-dev-local-healthtech-phi-master-key-change-me}
      PRESCRIPTION_HMAC_SECRET: ${PRESCRIPTION_HMAC_SECRET:-dev-local-healthtech-hmac-secret-change-me}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-true}
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/healthtech-realm/protocol/openid-connect/certs
      OTEL_EXPORTER_OTLP_ENDPOINT: http://elastic-agent:4318
      OTEL_SERVICE_NAME: clinical-records-service
    ports:
      - "127.0.0.1:3006:3006"
    healthcheck:
