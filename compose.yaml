  staff-service:
    build:
      context: ./staff-service
      dockerfile: Dockerfile
    image: georgegxx/staff-service:latest
    container_name: staff-service
    environment:
      PORT: 3007
      DB_HOST: postgres
      DB_PORT: 5432
