apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: healthtech-istio-minikube
  namespace: istio-system
spec:
  profile: demo
  meshConfig:
    enableTracing: true
    defaultConfig:
      holdApplicationUntilProxyStarts: true
    extensionProviders:
      - name: otel-elastic-agent
        opentelemetry:
          service: elastic-agent.observability.svc.cluster.local
          port: 4317
  components:
    pilot:
      k8s:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
    ingressGateways:
      - name: istio-ingressgateway
        enabled: true
        k8s:
          service:
            type: LoadBalancer
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
