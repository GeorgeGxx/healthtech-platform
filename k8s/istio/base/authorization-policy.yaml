apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: keycloak-jwt-auth
spec:
  selector:
    matchLabels:
      app: kong-gateway
  jwtRules:
    - issuer: http://keycloak:8080/realms/healthtech-realm
      jwksUri: http://keycloak:8080/realms/healthtech-realm/protocol/openid-connect/certs
      forwardOriginalToken: true
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-kong-and-frontend-ingress
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"]
      to:
        - operation:
            ports: ["80", "8000"]
    - from:
        - source:
            namespaces: ["dev", "staging", "production"]
