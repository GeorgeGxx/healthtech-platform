apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: healthtech-microservices-isolation
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "healthtech.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: healthtech-platform
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
        - podSelector: {}
