apiVersion: v1
kind: ConfigMap
metadata:
  name: healthtech-shared-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "healthtech.labels" . | nindent 4 }}
data:
  DB_HOST: {{ .Values.config.dbHost | quote }}
  DB_PORT: {{ .Values.config.dbPort | quote }}
  DB_USER: {{ .Values.config.dbUser | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}
  KAFKA_BROKER: {{ .Values.config.kafkaBroker | quote }}
  KAFKAJS_NO_PARTITIONER_WARNING: "1"
  REDIS_HOST: {{ .Values.config.redisHost | quote }}
  REDIS_PORT: {{ .Values.config.redisPort | quote }}
  ELASTICSEARCH_URL: {{ .Values.config.elasticsearchUrl | quote }}
  KEYCLOAK_JWKS_URL: {{ .Values.config.keycloakJwksUrl | quote }}
  PATIENT_SERVICE_URL: {{ .Values.config.patientServiceUrl | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelEndpoint | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  DEV_AUTH_ENABLED: {{ .Values.config.devAuthEnabled | quote }}
