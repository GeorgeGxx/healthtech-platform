{{- if .Values.keyVault.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: healthtech-azure-keyvault
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "healthtech.labels" . | nindent 4 }}
spec:
  provider: azure
  secretObjects:
    - secretName: {{ .Values.secrets.secretName }}
      type: Opaque
      data:
        - objectName: DB-PASSWORD
          key: DB_PASSWORD
        - objectName: PHI-ENCRYPTION-KEY
          key: PHI_ENCRYPTION_KEY
        - objectName: PRESCRIPTION-HMAC-SECRET
          key: PRESCRIPTION_HMAC_SECRET
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ .Values.keyVault.clientId | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    tenantId: {{ .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: DB-PASSWORD
          objectType: secret
        - |
          objectName: PHI-ENCRYPTION-KEY
          objectType: secret
        - |
          objectName: PRESCRIPTION-HMAC-SECRET
          objectType: secret
{{- end }}
