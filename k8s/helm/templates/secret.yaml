{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.secretName }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "healthtech.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  PHI_ENCRYPTION_KEY: {{ .Values.secrets.phiEncryptionKey | quote }}
  PRESCRIPTION_HMAC_SECRET: {{ .Values.secrets.prescriptionHmacSecret | quote }}
{{- end }}
