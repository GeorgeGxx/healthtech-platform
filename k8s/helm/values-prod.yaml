global:
  environment: prod
  namespace: production
  imagePullPolicy: Always

secrets:
  create: false

keyVault:
  enabled: true
  name: healthtech-azure-prod-kv

config:
  devAuthEnabled: "false"

pdb:
  enabled: true
  minAvailable: 1

kongGateway:
  replicas: 2

services:
  appointmentService:
    replicas: 2
  patientService:
    replicas: 2
  billingService:
    replicas: 2
  pharmacyService:
    replicas: 2
  notificationService:
    replicas: 2
  clinicalRecordsService:
    replicas: 2
  staffService:
    replicas: 2
  frontend:
    replicas: 2
