@if (isOpen) {
  @if (variant === 'drawer') {
    <!-- Panel Lateral Deslizable Clínico (Slide-Over) -->
    <div
      (click)="onBackdropClick()"
      class="fixed inset-0 z-30 flex justify-end bg-slate-900/25 backdrop-blur-[1px] animate-fade-in"
      role="dialog"
      aria-modal="true"
    >
      <div
        (click)="$event.stopPropagation()"
        class="relative w-full sm:max-w-xl md:max-w-2xl h-full bg-white shadow-2xl flex flex-col border-l border-slate-200/90 animate-slide-left text-left overflow-hidden"
      >
        <!-- Encabezado Clínico del Panel -->
        <div class="flex items-center justify-between p-4 sm:p-5 border-b border-slate-100 bg-white shrink-0">
          <div class="min-w-0 pr-2">
            <div class="flex items-center gap-2.5 flex-wrap">
              <span class="w-2.5 h-2.5 rounded-full shrink-0 shadow-xs" [ngClass]="getDotColorClass()"></span>
              <h2 class="text-lg sm:text-xl font-bold text-slate-900 truncate">{{ title }}</h2>
              @if (badgeText) {
                <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold border" [ngClass]="getPillColorClass()">
                  {{ badgeText }}
                </span>
              }
            </div>
            @if (subtitle) {
              <p class="text-xs text-slate-500 mt-1 line-clamp-2">{{ subtitle }}</p>
            }
          </div>

          <button
            type="button"
            (click)="handleClose()"
            class="p-2 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-xl transition cursor-pointer shrink-0"
            aria-label="Close panel"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <!-- Contenedor del Formulario o Contenido -->
        <div class="flex-1 flex flex-col min-h-0 overflow-hidden">
          <ng-content></ng-content>
        </div>
      </div>
    </div>
  } @else {
    <!-- Ventana Central Médica (Modal Centrado Sutil) -->
    <div
      (click)="onBackdropClick()"
      class="fixed inset-0 z-30 overflow-y-auto bg-slate-900/35 backdrop-blur-xs animate-fade-in"
      role="dialog"
      aria-modal="true"
    >
      <div class="flex min-h-full items-center justify-center p-3 sm:p-6 text-center">
        <div
          (click)="$event.stopPropagation()"
          [ngClass]="maxWidth"
          class="relative w-full bg-white border border-slate-200/90 rounded-2xl sm:rounded-3xl shadow-2xl flex flex-col max-h-[88vh] text-left overflow-hidden animate-modal-pop"
        >
          <!-- Encabezado Clínico de la Ventana -->
          <div class="flex items-center justify-between p-4 sm:p-5 border-b border-slate-100 bg-white shrink-0">
            <div class="min-w-0 pr-2">
              <div class="flex items-center gap-2.5 flex-wrap">
                <span class="w-2.5 h-2.5 rounded-full shrink-0 shadow-xs" [ngClass]="getDotColorClass()"></span>
                <h2 class="text-lg sm:text-xl font-bold text-slate-900 truncate">{{ title }}</h2>
                @if (badgeText) {
                  <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold border" [ngClass]="getPillColorClass()">
                    {{ badgeText }}
                  </span>
                }
              </div>
              @if (subtitle) {
                <p class="text-xs text-slate-500 mt-1 line-clamp-2">{{ subtitle }}</p>
              }
            </div>

            <button
              type="button"
              (click)="handleClose()"
              class="p-2 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-xl transition cursor-pointer shrink-0"
              aria-label="Close modal"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </button>
          </div>

          <!-- Contenedor del Formulario o Contenido -->
          <div class="flex-1 flex flex-col min-h-0 overflow-hidden">
            <ng-content></ng-content>
          </div>
        </div>
      </div>
    </div>
  }
}
