name: HealthTech-Staff-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include: [develop, staging, master]
  paths:
    include:
      - staff-service/**
      - k8s/helm/**
      - devsecops/**
      - azure-devops/pipelines/staff-service.yml
      - azure-devops/templates/**

pr:
  branches:
    include: [develop, staging, master]
  paths:
    include:
      - staff-service/**
      - k8s/helm/**
      - devsecops/**
      - azure-devops/pipelines/staff-service.yml
      - azure-devops/templates/**

variables:
  - template: ../templates/gates.yml

pool:
  vmImage: ubuntu-latest

stages:
  - template: ../templates/app-stages.yml
    parameters:
      serviceName: staff-service
      serviceDir: staff-service
      serviceType: nestjs
      servicePort: 3007
      helmValuesKey: services.staffService
      serviceConnection: azure-service-connection
      acrNameDev: healthtechazuredevacr
      acrNameStaging: healthtechazurestagingacr
      acrNameProd: healthtechazureprodacr
      namePrefix: healthtech-azure
