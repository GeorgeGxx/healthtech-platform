# =============================================================================
# templates/steps/helm-deploy.yml  —  Helm upgrade of ONE service into ONE env
# Used by DeployDev / DeployStaging / DeployProduction (app-stages.yml).
#
# NOTE: no --atomic on purpose. Rollback lives in ONE place (helm-rollback.yml,
# run by the Rollback* stages). With --atomic + a rollback stage, the second
# `helm rollback` would go back to the FAILED revision.
# =============================================================================
parameters:
  - name: serviceConnection
    type: string
  - name: resourceGroup
    type: string
  - name: cluster
    type: string
  - name: namespace
    type: string
  - name: envName              # value for global.environment (dev | staging | production)
    type: string
  - name: acrName
    type: string
  - name: serviceName
    type: string
  - name: servicePort
    type: number
  - name: helmRelease
    type: string
  - name: helmChartPath
    type: string
    default: './k8s/helm'
  - name: helmVersion
    type: string
  - name: helmValuesKey
    type: string
    default: ''
  - name: deploymentName
    type: string
    default: ''
  - name: verifyRollout        # extra kubectl rollout check (used in production)
    type: boolean
    default: false

steps:
  # Deployment jobs: do not rely on an implicit checkout for chart/manifests.
  - checkout: self

  - bash: |
      set -euo pipefail
      bash scripts/install-helm4.sh "${{ parameters.helmVersion }}"
      bash scripts/install-yq.sh v4.44.3
      helm version --short
    displayName: "Install Helm ${{ parameters.helmVersion }} & yq"

  - task: AzureCLI@2
    displayName: "Helm upgrade -> ${{ parameters.envName }} (${{ parameters.cluster }} / ${{ parameters.namespace }})"
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        az aks get-credentials \
          --resource-group ${{ parameters.resourceGroup }} \
          --name ${{ parameters.cluster }} \
          --overwrite-existing
        if command -v kubelogin >/dev/null 2>&1; then kubelogin convert-kubeconfig -l azurecli; fi

        CHART_PATH="${{ parameters.helmChartPath }}"
        CHART_VERSION="$(yq '.version' "${CHART_PATH}/Chart.yaml")"
        [[ "$CHART_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid chart version: $CHART_VERSION"; exit 1; }
        echo "Deploying Helm chart ${CHART_PATH} (v${CHART_VERSION})"

        HELM_KEY="${{ parameters.helmValuesKey }}"
        if [ -z "$HELM_KEY" ]; then HELM_KEY="${{ parameters.serviceName }}"; fi

        IMAGE_DIGEST="$(az acr repository show --name "${{ parameters.acrName }}" --image "${{ parameters.serviceName }}:$(Build.SourceVersion)" --query digest -o tsv 2>/dev/null || true)"
        [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Unable to resolve an immutable image digest for ${{ parameters.serviceName }}:$(Build.SourceVersion) in ACR."; exit 1; }
        echo "Resolved immutable ACR image digest: ${IMAGE_DIGEST}"

        if [ "${COSIGN_VERIFY_ENFORCED:-false}" = "true" ]; then
          if ! command -v cosign &>/dev/null; then
            curl -fsSL https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64 -o /tmp/cosign
            sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
          fi
          echo "Verifying Cosign OCI image signature for ${{ parameters.acrName }}.azurecr.io/${{ parameters.serviceName }}@${IMAGE_DIGEST}..."
          cosign verify --key devsecops/supply-chain/cosign/cosign.pub "${{ parameters.acrName }}.azurecr.io/${{ parameters.serviceName }}@${IMAGE_DIGEST}"
        fi

        VALUES_ENV="${{ parameters.envName }}"
        if [ "$VALUES_ENV" = "production" ]; then VALUES_ENV="prod"; fi
        VALUES_ARGS=()
        if [ -f "${CHART_PATH}/values-${VALUES_ENV}.yaml" ]; then
          VALUES_ARGS+=(--values "${CHART_PATH}/values-${VALUES_ENV}.yaml")
        fi

        helm upgrade --install ${{ parameters.helmRelease }} "$CHART_PATH" \
          "${VALUES_ARGS[@]}" \
          --reuse-values \
          --namespace ${{ parameters.namespace }} \
          --create-namespace \
          --set ${HELM_KEY}.image=${{ parameters.acrName }}.azurecr.io/${{ parameters.serviceName }}:$(Build.SourceVersion) \
          --set ${HELM_KEY}.port=${{ parameters.servicePort }} \
          --set global.environment=${{ parameters.envName }} \
          --wait --timeout 5m \
          --cleanup-on-fail

        if kubectl get crd gateways.networking.istio.io >/dev/null 2>&1 && [ -d "k8s/istio/overlays/aks-cloud" ]; then
          echo "Applying Istio AKS cloud overlay to namespace ${{ parameters.namespace }}..."
          kubectl apply -n ${{ parameters.namespace }} -k k8s/istio/overlays/aks-cloud
        fi

  - ${{ if eq(parameters.verifyRollout, true) }}:
    - task: AzureCLI@2
      displayName: "Verify rollout health"
      inputs:
        azureSubscription: ${{ parameters.serviceConnection }}
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          DEPLOY_NAME="${{ parameters.deploymentName }}"
          if [ -z "$DEPLOY_NAME" ]; then DEPLOY_NAME="${{ parameters.helmRelease }}-${{ parameters.serviceName }}"; fi
          kubectl rollout status deployment/${DEPLOY_NAME} \
            -n ${{ parameters.namespace }} --timeout=2m
